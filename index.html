<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0a0f18">
<title>LUDO 🎲</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--sub:#9fb4c9;--stroke:rgba(255,255,255,.12)}
body{min-height:100vh;background:#0a0f18;font-family:'Vazirmatn',Tahoma,sans-serif;color:#eaf2fb;
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;display:block}
.ic{width:17px;height:17px;flex-shrink:0;display:block;object-fit:contain;filter:brightness(0) invert(1)}
.screen{display:none;position:relative;z-index:1;flex-direction:column;align-items:center;
  width:100%;max-width:440px;margin:0 auto;padding:14px 10px 24px}
#gameScreen{max-width:500px}
.screen.active{display:flex;animation:screenIn .4s cubic-bezier(.2,.9,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
.card{position:relative;width:100%;margin-top:14px;padding:20px 16px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid var(--stroke);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.logoArea{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px}
.topbar{font-size:46px;font-weight:900;letter-spacing:10px;line-height:1}
.gradText{background:linear-gradient(92deg,#8fd3ff,#b48bff 45%,#ff9bd2);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:hue 6s linear infinite}
@keyframes hue{to{background-position:200% 0}}
.tagline{color:var(--sub);font-size:13px}
.cardHint{text-align:center;color:var(--sub);font-size:13px;margin-bottom:4px}
.langRow{margin-top:24px}
.langBtn{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);color:#dbe9f8;font-family:inherit;font-size:13.5px;
  font-weight:bold;padding:11px 20px;border-radius:15px;cursor:pointer;transition:transform .15s}
.langBtn:active{transform:scale(.94)}
.langBtn .ic{width:18px;height:18px}
.footHint{margin-top:16px;color:#5c7290;font-size:11.5px;letter-spacing:.5px}
.btn{position:relative;overflow:hidden;font-family:inherit;border:none;border-radius:16px;
  padding:13px 18px;font-size:15px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .15s,box-shadow .3s,filter .3s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.5;filter:saturate(.4);pointer-events:none}
.btn.primary{color:#fff;background:linear-gradient(140deg,#5aa2ff,#2b6fe0 55%,#1f5cc7);
  box-shadow:0 10px 26px rgba(43,111,224,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}90%,100%{left:130%}}
.btn.green{color:#fff;background:linear-gradient(140deg,#3ec97a,#1f9d55 60%,#178045);
  box-shadow:0 10px 26px rgba(31,157,85,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#d6e5f5}
#joinRow{display:flex;gap:8px;width:100%;margin-top:10px}
#joinCode{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;color:#fff;font-family:inherit;font-size:16px;letter-spacing:5px;
  text-align:center;padding:12px;text-transform:uppercase;outline:none;transition:.25s}
#joinCode:focus{border-color:rgba(90,162,255,.8);box-shadow:0 0 0 3px rgba(90,162,255,.22)}
.codeBox{display:flex;align-items:stretch;gap:8px;width:100%;margin-top:14px;padding:6px;
  border-radius:18px;
  background:linear-gradient(120deg,#5aa2ff,#b48bff,#ff9bd2,#5aa2ff);
  background-size:300% 100%;animation:hue 6s linear infinite;
  box-shadow:0 10px 30px rgba(90,120,255,.25)}
.codeInner{flex:1;background:rgba(8,14,22,.88);border-radius:13px;padding:12px;text-align:center;
  font-size:26px;font-weight:900;letter-spacing:10px;text-shadow:0 0 16px rgba(130,180,255,.65);
  cursor:pointer}
.copyChip{border:none;border-radius:13px;background:rgba(90,162,255,.25);color:#cfe4ff;
  font-family:inherit;font-size:13px;font-weight:bold;padding:0 15px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:transform .1s;flex-shrink:0}
.copyChip .ic{width:15px;height:15px}
.copyChip:active{transform:scale(.94)}
.codeSub{text-align:center;font-size:11.5px;color:var(--sub);margin-top:7px}
.prow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 14px;margin-top:9px;
  font-size:14px;animation:screenIn .35s both}
.pdot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.crown{margin-inline-start:auto;animation:crownF 2s ease-in-out infinite;display:flex}
@keyframes crownF{50%{transform:translateY(-3px) rotate(9deg)}}
.crownIc{width:18px;height:18px}
.you{font-size:10.5px;background:rgba(90,162,255,.18);border:1px solid rgba(90,162,255,.5);
  color:#bcd9ff;padding:2px 9px;border-radius:20px;margin-inline-start:auto}
.crown ~ .you,.you ~ .crown{margin-inline-start:6px}
#gameTitle{font-size:22px;font-weight:900;letter-spacing:11px;margin:4px 0 10px}
#boardWrap{width:min(94vw,470px,58vh);border-radius:28px;box-shadow:0 24px 44px rgba(0,0,0,.55)}
#board{display:block;width:100%;height:auto}
#guideBar{width:min(94vw,470px);display:flex;gap:10px;margin-top:12px;min-height:52px;
  background:rgba(13,20,32,.82);border:1px solid var(--stroke);border-radius:18px;padding:10px 13px}
#turnDot{width:12px;height:12px;border-radius:50%;background:#fff;margin-top:7px;
  flex-shrink:0;position:relative;transition:background .3s}
#turnDot::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid currentColor;animation:pulseRing 1.4s ease-out infinite}
@keyframes pulseRing{from{transform:scale(.5);opacity:.9}to{transform:scale(1.5);opacity:0}}
#statusText{font-size:14px;font-weight:800;line-height:1.6}
#hint{color:#9db2c7;font-size:12px;margin-top:1px;min-height:16px;line-height:1.6}
#guideBtns{display:flex;gap:8px;align-items:center}
.miniBtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#ffc9c0;border-radius:12px;width:38px;height:38px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.miniBtn .ic{width:19px;height:19px}
.miniBtn:active{transform:scale(.88)}
#bottomBar{direction:ltr;width:min(94vw,470px);display:flex;align-items:center;gap:12px;margin-top:12px}
#leftPanel{direction:rtl;flex:1;min-width:0}
#playerCards{display:flex;flex-direction:column;gap:7px;max-height:200px;overflow-y:auto;
  padding:10px;margin:-10px;scrollbar-width:thin}
#playerCards::-webkit-scrollbar{width:4px}
#playerCards::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
.pcard{--pc:#888;--pl:#ccc;--pt:#fff;position:relative;display:flex;align-items:center;gap:8px;
  min-width:0;flex-shrink:0;background:rgba(255,255,255,.055);border:1.5px solid var(--pc);
  border-radius:12px;padding:9px 11px;font-size:12.5px;overflow:hidden;
  transition:background .25s,box-shadow .25s,transform .25s}
.pcard .pmini{width:12px;height:12px;border-radius:50%;background:var(--pc);flex-shrink:0;
  box-shadow:0 0 0 2px rgba(255,255,255,.25);transition:background .25s}
.pcard .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe9f3}
.pcard .tdots{margin-inline-start:auto;display:flex;gap:3px;flex-shrink:0}
.tdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.tdot.out{background:var(--tc);box-shadow:0 0 5px var(--tc)}
.tdot.home{background:linear-gradient(135deg,#ffe08a,#f5a623);box-shadow:0 0 6px #f5a623}
.pcard.active{background:linear-gradient(135deg,var(--pc),var(--pl));border-color:transparent;
  box-shadow:0 10px 28px -4px var(--pc),0 0 14px var(--pc),inset 0 0 0 1px rgba(255,255,255,.3);
  transform:translateY(-2px)}
.pcard.active .pname{color:var(--pt);font-weight:bold}
.pcard.active .pmini{background:#fff}
.pcard.active::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 65%);
  background-size:250% 100%;animation:cardSheen 2.6s linear infinite;pointer-events:none}
@keyframes cardSheen{from{background-position:130% 0}to{background-position:-130% 0}}
#diceBox{flex-shrink:0}
#dice{width:clamp(92px,26vw,112px);cursor:pointer;padding:6px;position:relative;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));transition:transform .15s}
#dice:active{transform:scale(.88)}
#dice.disabled{opacity:.55;pointer-events:none}
#dice.myRoll{filter:drop-shadow(0 6px 12px rgba(0,0,0,.45)) drop-shadow(0 0 13px rgba(255,255,255,.75));
  animation:dicePulse 1.25s ease-in-out infinite}
@keyframes dicePulse{50%{transform:scale(1.06)}}
#dice.rolling{animation:shake .4s ease infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg) translateY(-7px)}
  55%{transform:rotate(11deg) translateY(-3px)}80%{transform:rotate(-6deg)}}
#pips circle{transition:opacity .12s}
.token{transition:transform .18s ease-out}
.tbody,.tshadow,.selRing{transform-box:fill-box;transform-origin:center}
.token.hop .tbody{animation:hop .2s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{45%{transform:translateY(-9px) scale(1.1)}}
.token.hop .tshadow{animation:hopSh .2s ease}
@keyframes hopSh{45%{transform:scale(.55);opacity:.5}}
.token.movable{cursor:pointer}
.token.movable .tbody{animation:glowP 1.15s ease-in-out infinite}
@keyframes glowP{50%{transform:translateY(-3px) scale(1.08)}}
.token.movable .selRing{opacity:1;animation:ringSpin 3.5s linear infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.5}}
svg .glowRect.on{animation:baseGlow 1.8s ease-in-out infinite}
@keyframes baseGlow{50%{opacity:.7}}
#winOverlay{position:fixed;inset:0;background:rgba(8,13,20,.7);z-index:10;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#winOverlay.show{opacity:1;pointer-events:auto}
#confetti{position:absolute;inset:0;pointer-events:none}
.winCard{position:relative;text-align:center;
  background:linear-gradient(160deg,rgba(36,52,71,.94),rgba(16,24,35,.96));
  border:1px solid rgba(255,255,255,.16);padding:36px 48px;border-radius:26px;
  transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1);
  box-shadow:0 26px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
#winOverlay.show .winCard{transform:scale(1)}
.winEmoji{font-size:60px;filter:drop-shadow(0 6px 14px rgba(255,200,60,.55));
  animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-12px)}}
#winText{font-size:19px;margin:14px 0 20px}
#againBtn{background:linear-gradient(140deg,#5aa2ff,#2b6fe0);color:#fff;border:none;
  font-family:inherit;font-size:15px;font-weight:bold;padding:12px 32px;border-radius:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto;
  box-shadow:0 8px 22px rgba(43,111,224,.45)}
#closeWinBtn{background:rgba(255,255,255,.1);color:#cfe1f3;border:none;
  font-family:inherit;font-size:14px;padding:10px 24px;border-radius:13px;margin-top:10px;
  cursor:pointer;display:block;margin-inline:auto}
#connBadge{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;display:none;
  background:rgba(160,35,35,.92);padding:8px 18px;border-radius:22px;font-size:12px;
  border:1px solid rgba(255,120,120,.4);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#afkBadge{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:none;
  background:rgba(190,125,20,.92);padding:8px 18px;border-radius:22px;font-size:12px;max-width:92vw;
  text-align:center;border:1px solid rgba(255,200,110,.4);box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="menuScreen" class="screen active">
  <div class="logoArea">
    <div class="topbar gradText">LUDO</div>
    <div class="tagline" data-i18n="tagline"></div>
  </div>
  <div class="card">
    <div class="cardHint" data-i18n="menuHint"></div>

    <div id="joinRow">
      <input id="joinCode" data-i18n-ph="codePh" maxlength="5" autocomplete="off">
      <button class="btn ghost" id="joinBtn" data-i18n="join" style="width:auto;margin:0"></button>
    </div>
  </div>
  <div class="langRow">
    <button id="langBtn" class="langBtn">
      <img class="ic" src="icons/languages.svg" alt=""><span id="langLbl"></span>
    </button>
  </div>
  <div class="footHint" data-i18n="foot"></div>
</div>

<div id="lobbyScreen" class="screen">
  <div class="topbar" style="font-size:20px;letter-spacing:2px" data-i18n="lobbyTitle"></div>
  <div class="codeBox" id="roomCodeBox">
    <div class="codeInner" id="roomCodeTxt"></div>

  </div>
  <div class="codeSub" data-i18n="codeHint"></div>
  <div class="card">
    <div style="font-size:13px;color:var(--sub)" data-i18n="players"></div>
    <div class="plist" id="plist"></div>
    <button class="btn green" id="startBtn">
      <img class="ic" src="icons/play.svg" alt=""><span id="startLbl"></span>
    </button>
    <button class="btn primary" id="inviteBtn">
      <img class="ic" src="icons/share.svg" alt=""><span data-i18n="invite"></span>
    </button>
    <button class="btn ghost" id="copyInviteBtn">
      <img class="ic" src="icons/copy.svg" alt=""><span id="copyLinkLbl" data-i18n="copyLink"></span>
    </button>
    <button class="btn ghost" id="leaveBtn">
      <img class="ic" src="icons/log-out.svg" alt=""><span data-i18n="leave"></span>
    </button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div id="gameTitle" class="gradText">LUDO</div>
  <div id="boardWrap"><svg id="board" viewBox="0 0 600 600"></svg></div>
  <div id="guideBar">
    <span id="turnDot"></span>
    <div style="min-width:0;flex:1">
      <div id="statusText"></div>
      <div id="hint"></div>
    </div>
    <div id="guideBtns">
      <button id="vibBtn" class="miniBtn" title="vibration">
        <img class="ic" id="vibIc" src="icons/vibrate.svg" alt="">
      </button>
      <button id="muteBtn" class="miniBtn" title="sound">
        <img class="ic" id="volIc" src="icons/volume.svg" alt="">
      </button>
      <button id="exitGameBtn" class="miniBtn" title="exit">
        <img class="ic" src="icons/log-out.svg" alt="">
      </button>
    </div>
  </div>
  <div id="bottomBar">
    <div id="leftPanel"><div id="playerCards"></div></div>
    <div id="diceBox">
      <div id="dice">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="diceFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d9d9"/>
            </linearGradient>
          </defs>
          <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#diceFace)" stroke="#bfbfbf" stroke-width="2"/>
          <g id="pips" fill="#262626">
            <circle id="p_c" cx="50" cy="50" r="9.5"/><circle id="p_tl" cx="29" cy="29" r="9.5"/>
            <circle id="p_tr" cx="71" cy="29" r="9.5"/><circle id="p_ml" cx="29" cy="50" r="9.5"/>
            <circle id="p_mr" cx="71" cy="50" r="9.5"/><circle id="p_bl" cx="29" cy="71" r="9.5"/>
            <circle id="p_br" cx="71" cy="71" r="9.5"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<div id="winOverlay">
  <canvas id="confetti"></canvas>
  <div class="winCard">
    <div class="winEmoji">🏆</div>
    <div id="winText"></div>
    <button id="againBtn">
      <img class="ic" src="icons/play.svg" alt=""><span data-i18n="again"></span>
    </button>
    <button id="closeWinBtn" data-i18n="close"></button>
  </div>
</div>

<div id="connBadge" data-i18n="weak"></div>
<div id="afkBadge"></div>

<script>
'use strict';

/* ============ تنظیمات ============ */
const WORKER_URL = 'https://ludo-proxy.qissy-pc.workers.dev';
const BOT_USERNAME = 'PVP_Ludo_bot';
const APP_SHORT    = 'ludo';

const tg = window.Telegram?.WebApp ?? {};
tg.ready?.(); tg.expand?.();
try{tg.setHeaderColor?.('#0a0f18');tg.setBackgroundColor?.('#0a0f18');}catch(e){}
const tgUser     = tg.initDataUnsafe?.user;
const myId       = String(tgUser?.id ?? 'g' + Math.floor(Math.random() * 1e9));
const myName     = (tgUser?.first_name || 'Guest').slice(0, 14);
const startParam = tg.initDataUnsafe?.start_param;

const hap  = t => { try{tg.HapticFeedback?.impactOccurred?.(t)}catch(e){} };
const hapN = t => { try{tg.HapticFeedback?.notificationOccurred?.(t)}catch(e){} };

/* ============ لایه API ============ */
const INIT_DATA = tg.initData || '';
const API = WORKER_URL + '/api';
async function req(method, path, body) {
  const r = await fetch(API + path, { method,
    headers: {'Content-Type':'application/json','X-Init-Data':INIT_DATA},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 429 || r.status === 503) {
    const retry = +(r.headers.get('Retry-After') || 5);
    const e = new Error('busy'); e.busy = true; e.retry = retry; throw e;
  }
  if (!r.ok) {
    let api = 'http'; try { api = (await r.json()).error || api; } catch(_){}
    const e = new Error(api); e.api = api; throw e;
  }
  return r.json();
}

/* ============ چندزبانه ============ */
const I18N = {
  fa: { dir:'rtl', langName:'فارسی',
    tagline:'مهره‌هات رو برسون خونه',
    menuHint:'با دوستانت از هر جای تلگرام بازی کن (۲ تا ۴ نفره)',
    create:'ساخت اتاق جدید', codePh:'کد اتاق', join:'ورود',
    foot:'ساخته‌شده برای تلگرام • بدون نیاز به نصب',

    players:'بازیکن‌ها', start:'شروع بازی', startNeed:'حداقل ۲ نفر لازم است',
    waitingHost:'منتظر میزبان...', invite:'دعوت از طریق تلگرام',
    copyLink:'کپی لینک دعوت', leave:'خروج از اتاق',
    copy:'کپی', copied:'کپی شد', you:'شما',
    weak:'اتصال ضعیف — در تلاش برای اتصال...',
    turnYou:'نوبت توست، {name}!', turnOther:'نوبت {name} است',
    rollDice:'روی تاس بزن!', rolled:'تاس {n} آوردی — مهره انتخاب کن',
    noMove:'حرکتی ممکن نیست...', commitDice:'در حال ثبت تاس...',
    connLost:'اتصال قطع شد — دوباره تلاش کن', moveErr:'خطا در ثبت حرکت!',
    eaten:'مهره‌ات خورده شد!', capture:'خوردی!',
    afkPass:'نوبت بازیکن غایب رد شد', playerLeft:'یک بازیکن از بازی خارج شد',
    roomClosed:'اتاق بسته شد',
    lobbyClosedAfk:'اتاق به دلیل بی‌فعالیتی بسته شد',

let actx = null, muted = localStorage.getItem('ludo_mute') === '1';
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d, type='sine', v=.15, when=0, slide=0) {
  const a = ac(); if (!a || muted) return;
  const tt = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, tt);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), tt + d);
  g.gain.setValueAtTime(v, tt);
  g.gain.exponentialRampToValueAtTime(.001, tt + d);
  o.connect(g).connect(a.destination); o.start(tt); o.stop(tt + d + .02);
}
function noiseHit(d=.06, v=.12, when=0) {
  const a = ac(); if (!a || muted) return;
  const tt = a.currentTime + when;
  const b = a.createBuffer(1, Math.max(1, a.sampleRate * d | 0), a.sampleRate);
  const ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
  const s = a.createBufferSource(); s.buffer = b;
  const g = a.createGain(); g.gain.value = v;
  s.connect(g).connect(a.destination); s.start(tt);
}

const bg = $('bg'), bctx = bg.getContext('2d');
let bw, bh, blobs = [], stars = [];

let lastBgFrame = 0;
const hexA = (h,a) => { const n = parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
function sizeBg() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  bw = innerWidth; bh = innerHeight;
  bg.width = bw * dpr; bg.height = bh * dpr;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderNebula();
}
function renderNebula() {
  neb.width = bw; neb.height = bh;
  const g = nctx.createLinearGradient(0, 0, 0, bh);
  g.addColorStop(0, '#0d1523'); g.addColorStop(1, '#090e16');
  nctx.fillStyle = g; nctx.fillRect(0, 0, bw, bh);
  nctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) {
    const x = b.x * bw, y = b.y * bh, rr = b.r * Math.max(bw, bh) * .75;
    const rg = nctx.createRadialGradient(x, y, 0, x, y, rr);
    rg.addColorStop(0, hexA(b.c, b.a)); rg.addColorStop(1, hexA(b.c, 0));
    nctx.fillStyle = rg; nctx.fillRect(0, 0, bw, bh);
  }
  nctx.globalCompositeOperation = 'source-over';
}
function initBg() {
  sizeBg();
  blobs = [['#2b6fe0',.30],['#7b3ff2',.22],['#00b3a4',.18],['#e05fa0',.13]].map((b,i) =>
    ({ c:b[0], a:b[1], x:Math.random(), y:Math.random(), r:.45+Math.random()*.35 }));
  stars = Array.from({length:55}, () =>
    ({ x:Math.random(), y:Math.random(), r:Math.random()*1.3+.3,
       tw:Math.random()*7, sp:.4+Math.random()*.8 }));
  renderNebula();
  requestAnimationFrame(drawBg);
}
function drawBg(ts) {
  requestAnimationFrame(drawBg);
  if (document.hidden) return;
  if (ts - lastBgFrame < 40) return;
  lastBgFrame = ts;
  bctx.clearRect(0, 0, bw, bh);
  bctx.drawImage(neb, 0, 0, bw, bh);
  const s = ts / 1000;
  bctx.fillStyle = '#cfe4ff';
  for (const st of stars) {
    bctx.globalAlpha = .15 + .5 * Math.abs(Math.sin(s * st.sp + st.tw));
    bctx.beginPath(); bctx.arc(st.x * bw, st.y * bh, st.r, 0, 7); bctx.fill();
  }
  bctx.globalAlpha = 1;
}

function starPath(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = Math.PI * i / 5 - Math.PI / 2;
    d += (i === 0 ? 'M' : 'L') + (cx + rad * Math.cos(a)).toFixed(2) + ' ' +
         (cy + rad * Math.sin(a)).toFixed(2) + ' ';
  }
  return d + 'Z';
}

/* ============ مهره‌ها ============ */
const TOKEN_SCALE = 1.32;
const tokenEls = {};
function posOf(color, step, i) {
  const o = COLORS[color];
  if (step === -1) return o.anchors[i];
  if (step === 56) return o.end;
  if (step <= 50)  return PATH[(o.start + step) % 52];
  return o.home5[step - 51];
}
function makeToken(color) {
  const g = el('g', {class:'token'});
  const sc = el('g', {transform:`scale(${TOKEN_SCALE})`});
  const sh = el('ellipse',{class:'tshadow', cx:0, cy:8, rx:12, ry:4.4, fill:'rgba(30,20,5,.3)'});
  const body = el('g', {class:'tbody'});
  body.appendChild(el('path',{
    d:'M -9.5 6.5 C -9.5 1.5 -5.5 -0.5 -4.5 -4.5 L 4.5 -4.5 C 5.5 -0.5 9.5 1.5 9.5 6.5 Z',
    fill:`url(#lg-${color})`, stroke:'rgba(0,0,0,.35)', 'stroke-width':.9}));
  body.appendChild(el('circle',{cx:0, cy:-9.5, r:7.4,
    fill:`url(#rg-${color})`, stroke:'rgba(0,0,0,.35)', 'stroke-width':.9}));
  body.appendChild(el('ellipse',{cx:-2.6, cy:-12.2, rx:2.7, ry:1.8, fill:'rgba(255,255,255,.85)'}));
  body.appendChild(el('path',{d:'M -6.5 3 C -7.5 0.5 -6.5 -2 -5 -4',
    stroke:'rgba(255,255,255,.5)', 'stroke-width':1.4, fill:'none', 'stroke-linecap':'round'}));
  const ring = el('circle',{class:'selRing', cx:0, cy:-1, r:13.5, fill:'none',
    stroke:'#fff', 'stroke-width':2, 'stroke-dasharray':'5 6', opacity:0});
  sc.appendChild(sh); sc.appendChild(body); sc.appendChild(ring);
  g.appendChild(sc);
  return g;
}
function ensureTokens() {
  for (const c of room.game.order) {
    if (tokenEls[c]) continue;
    tokenEls[c] = [];
    for (let i = 0; i < 4; i++) {
      const g = makeToken(c);
      g.addEventListener('click', () => onTokenClick(c, i));
      svg.insertBefore(g, fxLayer);
      tokenEls[c].push(g);
    }
    lastTokSig = '';
  }
}
function renderTokens() {
  ensureTokens();
  const groups = {};
  for (const color in state.tokens)
    state.tokens[color].forEach((s, i) => {
      const [r, c] = posOf(color, s, i);
      const k = r + ',' + c;
      (groups[k] = groups[k] || []).push({color, i, r, c});
    });
  const flat = [];
  let sig = '';
  Object.keys(groups).sort().forEach(k => groups[k].forEach((tk, j) => {
    const off = groups[k].length > 1 ? (j - (groups[k].length - 1) / 2) * 11 : 0;
    tk.x = px(tk.c) + off; tk.y = px(tk.r) + off;
    sig += tk.color + tk.i + Math.round(tk.x) + ',' + Math.round(tk.y) + ';';
    flat.push(tk);
  }));
  if (sig === lastTokSig) return;
  lastTokSig = sig;
  flat.sort((a, b) => a.r - b.r || a.c - b.c)
      .forEach(tk => {
        const gEl = tokenEls[tk.color][tk.i];
        gEl.style.transform = `translate(${tk.x}px, ${tk.y}px)`;
        svg.insertBefore(gEl, fxLayer);
      });
}
async function animateMove(color, i, from, to) {
  const g = tokenEls[color] && tokenEls[color][i];
  if (!g) return;
  svg.insertBefore(g, fxLayer);
  for (let s = from + 1; s <= to; s++) {
    const [r, c] = posOf(color, s, i);
    g.style.transform = `translate(${px(c)}px, ${px(r)}px)`;
    g.classList.remove('hop'); void g.getBoundingClientRect();
    g.classList.add('hop');
    sfx.step(s - from);
    await sleep(190);
  }
  g.classList.remove('hop');
}
function burst(r, c, color) {
  if (!fxLayer) return;
  const cx = px(c), cy = px(r), col = COLORS[color]?.lite || '#fff';
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 26;
    const cir = el('circle',{cx, cy, r:2.5 + Math.random() * 3,
      fill: i % 3 ? col : '#ffd76a', opacity:1});
    fxLayer.appendChild(cir);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 10;
    try {
      cir.animate(
        [{transform:'translate(0,0)', opacity:1},
         {transform:`translate(${dx}px, ${dy + 16}px)`, opacity:0}],
        {duration:520, easing:'cubic-bezier(.2,.7,.3,1)'}
      ).onfinish = () => cir.remove();
    } catch(e) { setTimeout(() => cir.remove(), 550); }
  }
}

const cardEls = {};
function renderPlayerCards() {
  const order = room.game.order;
  const box = $('playerCards');

    ).join('');

}

/* ============ polling ============ */
function loopPoll(){ pollT = setTimeout(async () => { await pollNow(); loopPoll(); }, pollMs); }
function startPolling(){ stopPolling(); pollMs = 1500; loopPoll(); }
function stopPolling(){ clearTimeout(pollT); pollT = null; }
async function pollNow() {
  if (!roomCode || document.hidden) return;
  try {
    const data = await req('GET', '/room/' + roomCode);
    if (data && data._srv) srvOffset = Date.now() - data._srv;
    failCount = 0; pollMs = 1500;
    connBadge.style.display = 'none';
    onRoomData(data);
  } catch (e) {
    if (e.busy) { connBadge.textContent = t('busy'); connBadge.style.display = 'block'; return; }
    if (e.api === 'maintenance') { connBadge.textContent = t('maintenance'); connBadge.style.display = 'block'; return; }
    if (e.api === 'banned') { leaveToMenu(t('banned')); return; }
    if (++failCount >= 4) { connBadge.textContent = t('weak'); connBadge.style.display = 'block'; }
    pollMs = Math.min(Math.round(pollMs * 1.7), 10000);
  }
}

/* ============ دریافت وضعیت اتاق ============ */
function namesFromPlayers() {
  for (const p of Object.values(room.players || {})) names[p.color] = p.name;
}
function onRoomData(data) {
  if (!data) return leaveToMenu(t('roomClosed'));
  room = data;
  const me = (room.players || {})[myId];
  if (!me) return;
  myColor = me.color;
  namesFromPlayers();
  fixHostIfNeeded();
  afkCheck();
  if (!room.started) { phase = 'lobby'; return showLobby(); }
  const g = room.game;
  state.tokens = g.tokens;
  if (phase === 'anim' || phase === 'rolling') return;
  if (remoteBusy) return;
  if (cleanupDeparted()) return;
  if (g.lastMove && g.lastMove.seq > handledMoveSeq) {
    handledMoveSeq = g.lastMove.seq;
    const mv = g.lastMove;
    if (mv.by !== myId) {
      remoteBusy = true;
      ensureTokens();
      animateMove(mv.color, mv.i, mv.from, mv.to).then(() => {
        remoteBusy = false;
        if (mv.hit) {
          const [r, c] = posOf(mv.color, mv.to, mv.i);
          burst(r, c, mv.hitColor);
          sfx.capture(); hap('medium');
          if (mv.hitColor === myColor) hintEl.textContent = t('eaten');
        }
        renderTokens();
        lastRoomSig = '';
        renderGame();
      }).catch(() => {
        remoteBusy = false;
        renderTokens();
        lastRoomSig = '';
        renderGame();
      });
      return;
    }
  }
  const sig = JSON.stringify([g.turn, g.dice, g.winner, g.tokens, g.order,
    g.lastMove ? g.lastMove.seq : 0, room.host, room.started, room.players]);
  if (sig === lastRoomSig && !(g.turn === myColor && g.dice == null)) return;
  lastRoomSig = sig;
  renderGame();
}
function fixHostIfNeeded() {
  if (room.started) return;
  const ids = Object.keys(room.players || {});
  if (!ids.length || ids.includes(room.host)) return;
  if (ids[0] === myId) req('POST', '/room/' + roomCode + '/claimhost').catch(() => {});
}
function cleanupDeparted() {
  const g = room.game;
  if (!g || !g.order || g.winner) return false;
  const active = new Set(Object.values(room.players || {}).map(p => p.color));
  if (!g.order.some(c => !active.has(c))) return false;
  lastTokSig = ''; lastRoomSig = '';
  hintEl.textContent = t('playerLeft');
  req('POST', '/room/' + roomCode + '/cleanup').then(() => pollNow()).catch(() => {});
  return true;
}
function showLobby() {
  showScreen('lobby');
  $('roomCodeTxt').textContent = roomCode;
  const entries = Object.entries(room.players);
  const sig = entries.map(([u, p]) => u + ':' + p.color + ':' + p.name).join('|')
              + '#' + room.host + '#' + lang;
  if (sig !== lastPlistSig) {
    lastPlistSig = sig;
    $('plist').innerHTML = entries.map(([uid, p]) => {
      const dot = COLORS[p.color].main;
      return `<div class="prow">
        <span class="pdot" style="background:${dot};box-shadow:0 0 8px ${dot}"></span>
        <span>${esc(p.name)}</span>
        ${uid === myId ? `<span class="you">${esc(t('you'))}</span>` : ''}
        ${room.host === uid ? '<span class="crown"><img class="ic crownIc" src="icons/crown.svg" alt=""></span>' : ''}</div>`;
    }).join('');
  }
  const n = entries.length;
  const isHost = room.host === myId;
  $('startBtn').disabled = !isHost || n < 2;
  $('startLbl').textContent = isHost
    ? (n >= 2 ? t('start') : t('startNeed'))
    : t('waitingHost');
}

/* ============ رندر بازی ============ */
function clearHighlight() {
  document.querySelectorAll('.movable').forEach(e => e.classList.remove('movable'));
}
function renderGame() {
  showScreen('game');
  const g = room.game;
  renderTokens();
  renderPlayerCards();
  if (g.dice != null) {
    setDice(g.dice);
    diceLockUntil = 0;
  }
  for (const c of COLOR_ORDER)
    glowEls[c]?.classList.toggle('on', g.turn === c && !g.winner);
  if (g.winner) {
    if (!winSeen) showWin(g.winner);
    return;
  }
  winOverlay.classList.remove('show');
  winSeen = false;

  /* ✅ ویبره‌ی توجه: فقط وقتی نوبت تازه به من رسیده باشد */
  if (g.turn === myColor && prevTurn !== myColor) {
    if (vib) hapN('warning');
  }
  prevTurn = g.turn;

  turnDot.style.background = turnDot.style.color = COLORS[g.turn].main;
  statusText.innerHTML = (g.turn === myColor)
    ? t('turnYou', {name: `<b style="color:${COLORS[myColor].lite}">${esc(myName)}</b>`})
    : t('turnOther', {name: `<b style="color:${COLORS[g.turn].lite}">${esc(names[g.turn] || colorName(g.turn))}</b>`});
  if (g.turn === myColor) {
    if (g.dice == null) {
      if (diceLockUntil > Date.now()) {
        phase = 'wait';
        hintEl.textContent = t('commitDice');
      } else {
        if (phase !== 'rolling') phase = 'my-roll';
        hintEl.textContent = t('rollDice');
      }
    } else {
      if (phase !== 'my-move' && phase !== 'anim') {
        legal = computeLegal(myColor, g.dice);
        if (legal.length === 0) {
          phase = 'wait';
          hintEl.textContent = t('noMove');
          clearHighlight();
          schedulePass(g.dice);
        } else {
          phase = 'my-move';
          clearHighlight();
          legal.forEach(m => tokenEls[myColor][m.i].classList.add('movable'));
          hintEl.textContent = t('rolled', {n: g.dice});
        }
      }
    }
  } else {
    phase = 'wait';
    clearHighlight();
    hintEl.textContent = '';
  }
  diceEl.classList.toggle('myRoll', phase === 'my-roll');
  diceEl.classList.toggle('disabled', phase !== 'my-roll');
}
function computeLegal(color, d) {
  const moves = [];
  state.tokens[color].forEach((s, i) => {
    if (s === 56) return;
    if (s === -1) { if (d === 6) moves.push({i, to:0}); return; }
    if (s + d <= 56) moves.push({i, to:s + d});
  });
  return moves;
}
function schedulePass(diceVal) {
  if (passDiceVal === diceVal) return;
  clearTimeout(passTimer);
  passDiceVal = diceVal;
  passTimer = setTimeout(() => {
    passDiceVal = null;
    if (!room) return;
    const g = room.game;
    if (g.turn === myColor && g.dice === diceVal && !g.winner) {
      req('POST', '/room/' + roomCode + '/pass').then(() => pollNow()).catch(() => {});
    }
  }, 1300);
}

/* ============ انداختن تاس ============ */
diceEl.addEventListener('click', () => {
  if (phase !== 'my-roll') return;
  if (Date.now() < diceLockUntil) return;
  phase = 'rolling';
  hap('light');
  clearTimeout(passTimer); passDiceVal = null;
  hintEl.textContent = '';
  diceEl.classList.remove('myRoll');
  diceEl.classList.add('rolling', 'disabled');
  sfx.dice();
  let n = 0;
  const iv = setInterval(() => {
    setDice(1 + Math.floor(Math.random() * 6));
    if (++n === 9) {
      clearInterval(iv);
      diceEl.classList.remove('rolling');
      setDice(6);
      req('POST', '/room/' + roomCode + '/roll').then(res => {
        diceLockUntil = Date.now() + 2600;
        phase = 'wait';
        if (res && res.dice) setDice(res.dice);
        pollNow();
      }).catch(e => {
        if (e.api === 'rolled' || e.api === 'turn' || e.api === 'over') { phase = 'wait'; pollNow(); return; }
        phase = 'my-roll'; diceLockUntil = 0;
        diceEl.classList.remove('disabled'); diceEl.classList.add('myRoll');
        hintEl.textContent = e.busy ? t('busy') : t('connLost');
      });
    }
  }, 85);
});

/* ============ حرکت مهره ============ */
async function onTokenClick(color, i) {
  if (color !== myColor || phase !== 'my-move') return;
  const mv = legal.find(m => m.i === i);
  if (!mv) return;
  phase = 'anim';
  hap('light');
  clearHighlight();
  ensureTokens();
  const from = state.tokens[color][i], to = mv.to;
  await animateMove(color, i, from, to);
  try {
    const res = await req('POST', `/room/${roomCode}/move`, { i });
    state.tokens = res.game.tokens;
    room.game = res.game;
    renderTokens(); renderPlayerCards();
    const lm = res.game.lastMove;
    if (lm && lm.hit) {
      const [r, c] = posOf(lm.color, lm.to, lm.i);
      burst(r, c, lm.hitColor);
      sfx.capture(); hap('medium');
      hintEl.textContent = t('capture');
    }
    phase = 'wait';
    renderGame();
    pollNow();
  } catch (e) {
    phase = 'wait'; lastTokSig = ''; lastRoomSig = '';
    if (e.api === 'illegal' || e.api === 'turn') hintEl.textContent = t('errIllegal');
    else if (e.busy) hintEl.textContent = t('busy');
    else hintEl.textContent = t('moveErr');
    pollNow();
  }
}

/* ============ AFK (بر اساس حضور واقعی) ============ */
function afkCheck() {
  if (!room || !roomCode) return;
  afkBadge.style.display = 'none';
  const now = Date.now() - srvOffset;
  if (!room.started) {
    const last = room.lastAct || room.createdAt || now;
    const stale = now - last;
    if (stale > LOBBY_CLOSE) return tryCloseRoom(t('lobbyClosedAfk'));
    if (stale > LOBBY_WARN)
      showAfk(t('lobbyAfk', {s: Math.ceil((LOBBY_CLOSE - stale) / 1000)}));
    return;
  }
  const g = room.game;
  if (!g || g.winner) return;
  const turnUid = Object.entries(room.players || {}).find(([,p]) => p.color === g.turn)?.[0];
  const seenTs = turnUid != null ? (room.seen || {})[turnUid] : null;
  const base = seenTs != null ? seenTs : Math.max(room.lastAct || 0, room.createdAt || 0);
  const stale = now - base;
  if (stale > AFK_CLOSE) return tryCloseRoom(t('gameClosedAfk'));
  if (stale > AFK_WARN) {
    showAfk(t('gameAfk', {s: Math.ceil((AFK_CLOSE - stale) / 1000)}));
    return;
  }
  if (g.turn !== myColor && stale > AFK_PASS) {
    const i = g.order.indexOf(g.turn);
    if (i >= 0 && g.order[(i + 1) % g.order.length] === myColor) {
      req('POST', '/room/' + roomCode + '/skip').then(() => pollNow()).catch(() => {});
      hintEl.textContent = t('afkPass');
    }
  }
}
function showAfk(txt) {
  afkBadge.textContent = txt;
  afkBadge.style.display = 'block';
}
function tryCloseRoom(msg) {
  leaveToMenu(msg);
}

/* ============ برنده + کانفتی ============ */
const cCanvas = $('confetti'), cctx = cCanvas.getContext('2d');
const CONF_COLORS = ['#e53935','#43a047','#fdd835','#1e88e5','#ff7ab6','#ffffff'];
let confP = [], confRun = false, lastCf = 0, confElapsed = 0;
function confResize() { cCanvas.width = innerWidth; cCanvas.height = innerHeight; }
function startConfetti() {
  confResize();
  const W = cCanvas.width, H = cCanvas.height, N = 110;
  confP = [];
  for (let i = 0; i < N; i++) {
    const lane = (i + Math.random() * .7) / N;
    confP.push({
      x: Math.random() * W,
      y: -30 - lane * H * .85,
      w: 6 + Math.random() * 5, h: 9 + Math.random() * 6,
      c: CONF_COLORS[i % CONF_COLORS.length],
      vy: 2.1 + Math.random() * 1.1,
      ph: Math.random() * 6.28,
      sw: .6 + Math.random() * .9,
      amp: .5 + Math.random() * .8,
      rot: Math.random() * 6.28,
      vr: -.14 + Math.random() * .28,
    });
  }
  confRun = true; lastCf = 0; confElapsed = 0;
  requestAnimationFrame(confTick);
}
function confTick(ts) {
  if (!confRun) return;
  if (!lastCf) lastCf = ts;
  const dt = Math.min((ts - lastCf) / 16.7, 2.5);
  lastCf = ts;
  confElapsed += dt * 16.7;
  cctx.clearRect(0, 0, cCanvas.width, cCanvas.height);
  let alive = 0;
  for (const p of confP) {
    if (p.y > cCanvas.height + 40) continue;
    alive++;
    p.y += p.vy * dt;
    p.x += Math.sin(confElapsed / 1000 * p.sw + p.ph) * p.amp * dt;
    p.rot += p.vr * dt;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.c; cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    cctx.restore();
  }
  if (alive > 0) requestAnimationFrame(confTick);
  else { confRun = false; cctx.clearRect(0, 0, cCanvas.width, cCanvas.height); }
}
function stopConfetti() { confRun = false; cctx.clearRect(0, 0, cCanvas.width, cCanvas.height); }
/* دیالوگ برد: بدون موسیقی و بدون ویبره — فقط کانفتی */
function showWin(color) {
  phase = 'over';
  winText.innerHTML =
    t('won', {name: `<b style="color:${COLORS[color].lite}">${esc(names[color] || colorName(color))}</b>`});
  againBtn.style.display = room.host === myId ? '' : 'none';
  winOverlay.classList.add('show');
  startConfetti();
}
againBtn.addEventListener('click', async () => {
  hap('light'); sfx.click();
  try {
    await req('POST', '/room/' + roomCode + '/start');
    winSeen = false;
    winOverlay.classList.remove('show');
    stopConfetti();
    lastRoomSig = '';
    lastTokSig = '';
    diceLockUntil = 0;
    prevTurn = null;
    pollNow();
  } catch (e) {}
});
closeWinBtn.addEventListener('click', () => {
  hap('light'); sfx.click();
  winSeen = true;
  leaveToMenu();
});

/* ============ شروع ============ */
initBg();
drawBoard();
setDice(6);
applyI18n();
setVolIcon();
setVibIcon();
showScreen('menu');
if (startParam) joinRoomByCode(startParam);
</script>
