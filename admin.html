<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUDO Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f18;color:#eaf2fb;font-family:Tahoma,sans-serif;padding:20px;max-width:900px;margin:auto}
h1{font-size:20px;margin-bottom:14px} h2{font-size:15px;margin:22px 0 8px;color:#9fb4c9}
input,button{font-family:inherit;font-size:13px;border-radius:10px;padding:9px 12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;outline:none}
button{cursor:pointer} button:active{transform:scale(.96)}
.btnD{background:#a33;border-color:#c55} .btnG{background:#2a7} .btnW{background:#556}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px}
.card b{font-size:22px;display:block} .card span{color:#9fb4c9;font-size:11.5px}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ec97a,#f5a623,#e53935)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
th{color:#9fb4c9;font-weight:normal}
.bad{color:#ff8a80} .ok{color:#81c784}
.banRow{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12.5px}
#gate{max-width:340px;margin:80px auto;text-align:center}
#gate input{width:100%;margin:10px 0}
</style>
</head>
<body>
<div id="gate">
  <h1>🔐 پنل مدیریت LUDO</h1>
  <input id="key" type="password" placeholder="ADMIN_KEY">
  <button class="btnG" style="width:100%" onclick="login()">ورود</button>
</div>
<div id="panel" hidden>
  <h1>LUDO — پنل مدیریت <button class="btnW" style="float:left" onclick="logout()">خروج</button></h1>
  <div class="cards" id="cards"></div>
  <div class="row">
    <button id="maintBtn" onclick="toggleMaint()"></button>
    <button class="btnW" onclick="refresh()">↻ بروزرسانی</button>
    <span style="color:#5c7290;font-size:11px">هر ۵ ثانیه خودکار</span>
  </div>
  <h2>اتاق‌ها</h2>
  <table id="rooms"></table>
  <h2>کاربران مسدود</h2>
  <div class="row">
    <input id="banUid" placeholder="Telegram user id" style="width:180px">
    <input id="banReason" placeholder="دلیل" style="width:200px">
    <button class="btnD" onclick="ban()">مسدود کن</button>
  </div>
  <div id="bans"></div>
</div>
<script>
const WORKER = 'https://ludo-proxy.qissy-pc.workers.dev';
let KEY = localStorage.getItem('ludo_admin') || '';
let maintOn = false;

async function api(path, body){
  const r = await fetch(WORKER + '/api/admin/' + path, {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json','X-Admin-Key':KEY},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 403){ logout(); throw new Error('forbidden'); }
  return r.json();
}
function login(){ KEY = document.getElementById('key').value.trim();
  if(!KEY) return; localStorage.setItem('ludo_admin', KEY);
  document.getElementById('gate').hidden = true;
  document.getElementById('panel').hidden = false; refresh(); }
function logout(){ localStorage.removeItem('ludo_admin'); KEY='';
  location.reload(); }

const ago = ts => { const s = Math.floor((Date.now()-ts)/1000);
  return s<60 ? s+' ثانیه' : s<3600 ? Math.floor(s/60)+' دقیقه' : Math.floor(s/3600)+' ساعت'; };

async function refresh(){
  try{
    const d = await api('overview');
    maintOn = d.maintenance;
    document.getElementById('maintBtn').textContent = maintOn ? '🟢 خروج از حالت نگهداری' : '🛑 حالت نگهداری';
    document.getElementById('maintBtn').className = maintOn ? 'btnG' : 'btnD';
    const pct = Math.min(100, Math.round(d.used / d.hard * 100));
    document.getElementById('cards').innerHTML = `
      <div class="card"><b>${d.used.toLocaleString()}</b><span>درخواست امروز (از ${d.hard.toLocaleString()})</span>
        <div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="card"><b>${d.activeGames}</b><span>بازی فعال</span></div>
      <div class="card"><b>${d.playersOnline}</b><span>بازیکن آنلاین (۳ دقیقه)</span></div>
      <div class="card"><b>${d.roomsTotal}</b><span>اتاق کل</span></div>`;
    document.getElementById('rooms').innerHTML =
      '<tr><th>کد</th><th>بازیکن‌ها</th><th>وضعیت</th><th>آخرین فعالیت</th><th></th></tr>' +
      d.rooms.map(r => `<tr>
        <td><b>${r.code}</b></td>
        <td>${r.players.map(p=>`${p.name} <small style="color:#9fb4c9">(${p.color})</small>`).join('، ')}</td>
        <td>${r.winner ? `<span class="ok">پایان‌یافته</span>` : r.started ? '<span class="ok">در حال بازی</span>' : 'لابی'}</td>
        <td>${ago(r.lastAct)} پیش</td>
        <td><button class="btnD" onclick="closeRoom('${r.code}')">بستن</button></td>
      </tr>`).join('') || '<tr><td colspan="5">اتاقی نیست</td></tr>';
    document.getElementById('bans').innerHTML = d.bans.length
      ? d.bans.map(b => `<div class="banRow">🚫 <b>${b.id}</b> — ${b.reason||'—'}
          <button class="btnW" onclick="unban('${b.id}')">رفع</button></div>`).join('')
      : '<div style="color:#5c7290;font-size:12px;margin-top:8px">موردی نیست</div>';
  }catch(e){}
}
function closeRoom(c){ if(confirm('اتاق '+c+' بسته شود؟')) api('close',{code:c}).then(refresh); }
function ban(){ const uid=document.getElementById('banUid').value.trim();
  if(!uid) return; api('ban',{uid, reason:document.getElementById('banReason').value}).then(refresh); }
function unban(uid){ api('unban',{uid}).then(refresh); }
function toggleMaint(){ api('maintenance',{on:!maintOn}).then(refresh); }

if (KEY){ document.getElementById('gate').hidden=true;
  document.getElementById('panel').hidden=false; refresh(); }
setInterval(()=>{ if(KEY && !document.getElementById('panel').hidden) refresh(); }, 5000);
</script>
</body>
</html>
